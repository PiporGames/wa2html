<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; media-src data:; style-src 'nonce-{{NONCE}}'; script-src 'nonce-{{NONCE}}'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} · WhatsApp</title>
<style nonce="{{NONCE}}">
:root{color-scheme:light;--page:#dadbd3;--bar:#f0f2f5;--chat:#efeae2;--bubble:#fff;--own:#d9fdd3;--text:#111b21;--muted:#54656f;--green:#008069;--border:#d1d7db;--system:#fff4c4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#00a884 0 145px,var(--page) 145px);color:var(--text);font:14px/1.5 "Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;padding:24px}
.app{max-width:1120px;margin:auto;box-shadow:0 6px 30px #0002;overflow:hidden;border-radius:12px;background:var(--chat)}
header{display:flex;gap:14px;align-items:center;background:var(--bar);padding:17px 24px;border-bottom:1px solid var(--border)}
.avatar{display:grid;place-items:center;width:46px;height:46px;flex-shrink:0;background:var(--green);color:white;border-radius:50%;font-size:24px}
h1{font-size:17px;margin:0;overflow-wrap:anywhere}header p{margin:2px 0 0;color:var(--muted);font-size:12px}.heading{flex:1;min-width:0}
.badge{color:var(--green);font-size:12px;border:1px solid var(--border);border-radius:20px;padding:5px 10px;white-space:nowrap}
.toolbar{display:flex;gap:10px;padding:12px 24px;align-items:center;background:var(--bar);border-bottom:1px solid var(--border)}
.toolbar label{color:var(--muted)}input{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;background:var(--bubble);color:var(--text);padding:10px 14px;font:inherit}
button{border:1px solid var(--border);border-radius:8px;background:var(--bubble);color:var(--text);padding:9px 12px;cursor:pointer;font:inherit}
:focus-visible{outline:3px solid #00a884;outline-offset:3px}
.notice{text-align:center;color:var(--muted);background:var(--bar);margin:0;padding:8px;font-size:11px}
main{padding:24px 7% 40px;display:flex;flex-direction:column;gap:7px;background-color:var(--chat);background-image:radial-gradient(#8882 .8px,transparent .8px);background-size:18px 18px;min-height:65vh}
.day{align-self:center;border-radius:8px;padding:5px 14px;margin:14px 0;background:var(--bar);font-size:12px;box-shadow:0 1px 2px #0001;color:var(--muted)}
.message{position:relative;align-self:flex-start;max-width:78%;padding:8px 10px 5px;background:var(--bubble);border-radius:0 8px 8px 8px;box-shadow:0 1px 1px #0002;min-width:100px;overflow-wrap:anywhere}
.message::before{content:"";position:absolute;left:-7px;top:0;border-top:8px solid var(--bubble);border-left:8px solid transparent}
.outgoing{align-self:flex-end;background:var(--own);border-radius:8px 0 8px 8px}.outgoing::before{left:auto;right:-7px;border-left:0;border-right:8px solid transparent;border-top-color:var(--own)}
.sender{display:block;color:var(--green);font-size:12px;margin-bottom:3px}.text{white-space:pre-wrap}.message time{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:3px}
.system{align-self:center;background:var(--system);font-size:12px;text-align:center;max-width:90%;border-radius:7px;color:var(--muted)}.system::before{display:none}
figure{margin:8px 0 2px}img,video{display:block;max-width:100%;max-height:480px;border-radius:6px;object-fit:contain}audio{display:block;width:320px;max-width:100%;margin:8px 0}
figcaption{font-size:12px;margin-top:5px}a{color:var(--green);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}.missing{display:block;color:var(--muted);margin-top:7px}
.extras{background:var(--bar);padding:18px;border-radius:10px;margin-top:24px}.extras h2{font-size:16px;margin:0}.extras p{font-size:12px;color:var(--muted)}
.attachment:empty::after{content:"📎 Cargando adjunto…";display:block;padding:12px;color:var(--muted)}
footer{text-align:center;padding:18px;background:var(--bar);color:var(--muted);font-size:11px}[hidden]{display:none!important}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0a1014;--bar:#202c33;--chat:#0b141a;--bubble:#202c33;--own:#005c4b;--text:#e9edef;--muted:#aebac1;--green:#50d8bb;--border:#38444c;--system:#26353d}body{background:var(--page)}}
@media(max-width:650px){body{padding:0}.app{border-radius:0}header{padding:12px}.toolbar{padding:10px}.badge{display:none}main{padding:12px 5% 28px}.message{max-width:92%}h1{font-size:15px}}
@media(prefers-reduced-motion:no-preference){.app{animation:appear .35s ease-out}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
@media print{body{padding:0;background:white}.app{box-shadow:none}.toolbar{display:none}.message{break-inside:avoid}}
</style>
</head>
<body><div class="app">
<header><div class="avatar" aria-hidden="true">☏</div><div class="heading"><h1>{{TITLE}}</h1><p>{{SUMMARY}}</p></div><span class="badge">Archivo local</span></header>
<div class="toolbar"><label for="search">Buscar</label><input id="search" type="search" placeholder="Texto, participante o archivo…" autocomplete="off"><button id="end" type="button">Ir al final ↓</button></div>
<p class="notice" id="status" role="status">Copia local · Sin conexión · Los archivos se incluyen en este HTML</p>
<noscript><p>Activa JavaScript para ver y descargar los adjuntos incorporados. El texto sigue disponible.</p></noscript>
<main id="chat" aria-label="Conversación">
<!-- MESSAGES -->
<footer>Archivo local sin cifrar · No compartas conversaciones ni adjuntos sin permiso.</footer>
</div>
<script nonce="{{NONCE}}">
const observer = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    const slot = entry.target;
    slot.append(document.getElementById(slot.dataset.file).content.cloneNode(true));
    const media = slot.querySelector('img, audio, video');
    if (media) slot.querySelector('a').href = media.getAttribute('src');
    observer.unobserve(slot);
  }
}, {rootMargin: '500px'});
document.querySelectorAll('[data-file]').forEach(slot => observer.observe(slot));
const messages = [...document.querySelectorAll('.message')];
const search = document.getElementById('search');
let timer;
search.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const query = search.value.toLocaleLowerCase();
    let count = 0;
    for (const message of messages) {
      message.hidden = !message.textContent.toLocaleLowerCase().includes(query);
      if (!message.hidden) count++;
    }
    document.getElementById('status').textContent = `${count} de ${messages.length} mensajes · Copia local sin conexión`;
  }, 150);
});
document.getElementById('end').addEventListener('click', () => document.querySelector('footer').scrollIntoView());
</script>
</body></html>
